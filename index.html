<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Неоновые крестики-нолики</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app" role="application" aria-labelledby="title">
        <header class="app__header">
            <h1 id="title" class="title">Неоновые крестики-нолики</h1>
            <p class="subtitle">Сразитесь с неоновым ИИ: тапните по клетке, чтобы поставить ✕</p>
        </header>

        <section class="scoreboard" aria-label="Таблица счёта">
            <article class="score-card score-card--x" aria-live="polite">
                <h2>Игрок ✕</h2>
                <p id="score-x" class="score-value">0</p>
            </article>
            <article class="score-card score-card--o" aria-live="polite">
                <h2>ИИ ◯</h2>
                <p id="score-o" class="score-value">0</p>
            </article>
            <article class="score-card score-card--draw" aria-live="polite">
                <h2>Ничьи</h2>
                <p id="score-draw" class="score-value">0</p>
            </article>
        </section>

        <div class="board-wrapper" aria-live="polite">
            <div id="board" class="board" role="grid" aria-label="Игровое поле 3 на 3">
                <button class="cell" data-index="0" role="gridcell" aria-label="Пустая клетка 1"></button>
                <button class="cell" data-index="1" role="gridcell" aria-label="Пустая клетка 2"></button>
                <button class="cell" data-index="2" role="gridcell" aria-label="Пустая клетка 3"></button>
                <button class="cell" data-index="3" role="gridcell" aria-label="Пустая клетка 4"></button>
                <button class="cell" data-index="4" role="gridcell" aria-label="Пустая клетка 5"></button>
                <button class="cell" data-index="5" role="gridcell" aria-label="Пустая клетка 6"></button>
                <button class="cell" data-index="6" role="gridcell" aria-label="Пустая клетка 7"></button>
                <button class="cell" data-index="7" role="gridcell" aria-label="Пустая клетка 8"></button>
                <button class="cell" data-index="8" role="gridcell" aria-label="Пустая клетка 9"></button>
            </div>
        </div>

        <p id="status" class="status" role="status" aria-live="assertive"></p>

        <button id="restart" class="primary-action" type="button" aria-label="Начать новую игру">Сыграть ещё</button>
    </div>

    <div class="glow"></div>
    <script src="script.js"></script>
</body>
</html>
